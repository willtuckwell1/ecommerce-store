<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Forgot Password</title>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'store_app/css/style.css' %}">
    <style>.message { color: #166534; background: #dcfce7; padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-weight: 600; border: 1px solid #bbf7d0; }</style>
</head>
<body>
    <div class="auth-shell">
        <div class="container">
            <div class="auth-logo"><i class="fa-solid fa-key"></i></div>
            <h2>Forgot Password</h2>
            <p class="subtitle">Enter your email address and follow the reset instructions.</p>

            {% if error %}
                <p class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</p>
            {% endif %}

            {% if message %}
                <p class="message"><i class="fa-solid fa-circle-check"></i> {{ message }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label><i class="fa-solid fa-envelope"></i> Email</label>
                <input type="email" name="email" required>

                <div class="action-row">
                    <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send reset email</button>
                    <button class="secondary-button" type="button" onclick="window.location.href='{% url 'login' %}'"><i class="fa-solid fa-arrow-left"></i> Back to Login</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
