<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'store_app/css/style.css' %}">
</head>
<body>
    <div class="auth-shell">
        <div class="container">
            <div class="auth-logo"><i class="fa-solid fa-store"></i></div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to manage your store or continue shopping.</p>

            {% if error %}
                <p class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" name="username">

                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" name="password">

                <div class="action-row">
                    <button type="submit" style="flex:1; justify-content:center;"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
                    <button class="secondary-button" type="button" style="flex:1; justify-content:center;" onclick="window.location.href='{% url 'register' %}'"><i class="fa-solid fa-user-plus"></i> Create Account</button>
                </div>
            </form>

            <p class="auth-footer">
                <a href="{% url 'forgot_password' %}"><i class="fa-solid fa-key"></i> Forgot password?</a>
            </p>
        </div>
    </div>
</body>
</html>
