<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Create Store</title>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'store_app/css/style.css' %}">
</head>
<body>
    <div class="auth-shell">
        <div class="container">
            <div class="auth-logo"><i class="fa-solid fa-shop"></i></div>
            <h2>Create a Store</h2>

            {% if error %}
                <p class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label><i class="fa-solid fa-shop"></i> Store name</label>
                <input type="text" name="name">

                <label><i class="fa-solid fa-align-left"></i> Description</label>
                <textarea name="description" rows="4"></textarea>

                <div class="action-row">
                    <button type="submit"><i class="fa-solid fa-plus"></i> Create Store</button>
                    <button class="secondary-button" type="button" onclick="window.location.href='{% url 'vendor_page' %}'"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
