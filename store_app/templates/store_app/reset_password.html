<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Reset Password</title>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'store_app/css/style.css' %}">
</head>
<body>
    <div class="auth-shell">
        <div class="container">
            <div class="auth-logo"><i class="fa-solid fa-lock"></i></div>
            <h2>Reset Password</h2>
            <p class="subtitle">Enter a new password for your account.</p>

            {% if error %}
                <p class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label><i class="fa-solid fa-lock"></i> New Password</label>
                <input type="password" name="new_password" required>

                <label><i class="fa-solid fa-lock"></i> Confirm Password</label>
                <input type="password" name="confirm_password" required>

                <div class="action-row">
                    <button type="submit"><i class="fa-solid fa-key"></i> Reset Password</button>
                    <button class="secondary-button" type="button" onclick="window.location.href='{% url 'login' %}'"><i class="fa-solid fa-arrow-left"></i> Back to Login</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
